<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>神隊友｜餐飲耗材補貨平台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="app" class="app-shell">
    <header class="brand-hero image-only-hero">
      <img
        class="hero-banner hero-banner-full"
        src="images/hero-banner.png"
        alt="神隊友餐飲耗材補貨平台"
      />

      <div class="hero-action-card">
        <div>
          <strong>今天需要補什麼？</strong>
          <span>搜尋耗材、加入補貨車，登入後即可送出採購單。</span>
        </div>
        <div class="hero-action-tags">
          <span>單包可買</span>
          <span>箱購優惠</span>
          <span>快速補貨</span>
        </div>
      </div>
    </header>

    <main>
      <section class="search-card">
        <input
          id="searchInput"
          type="search"
          placeholder="搜尋：餐盒、紙杯、吸管、手套、垃圾袋..."
          autocomplete="off"
        />
      </section>

      <section class="section-block">
        <div class="section-title">
          <h2>🔥 熱門補貨</h2>
          <button id="reloadBtn" class="text-btn" type="button">查看全部</button>
        </div>

        <div id="quickList" class="horizontal-list skeleton-row">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </section>

      <section class="section-block">
        <div class="section-title">
          <h2>商品分類</h2>
        </div>

        <div id="categoryList" class="category-list">
          <button class="category-chip active" type="button">載入中...</button>
        </div>
      </section>

      <section class="section-block last-section">
        <div class="section-title">
          <h2>全部耗材</h2>
          <span id="productTotal" class="muted">商品載入中...</span>
        </div>

        <div id="productGrid" class="product-grid">
          <div class="loading-box">
            <div class="loading-title">📦 耗材整理中</div>
            <div class="loading-desc">
              正在整理餐飲耗材與箱購價格<br />
              首次開啟約需數秒
            </div>
            <div class="loading-tip">請稍候一下，補貨清單馬上就好 🚚</div>
          </div>
        </div>
      </section>
    </main>

    <button id="cartBtn" class="bottom-cart-bar" type="button" aria-label="補貨車">
      <div class="bottom-cart-left">
        <span class="cart-icon-wrap">
          🛒
          <span id="cartCount" class="cart-badge">0</span>
        </span>

        <div>
          <strong>補貨車</strong>
          <small id="cartSummaryText">尚未加入商品</small>
        </div>
      </div>

      <div class="bottom-cart-right">
        <span id="bottomCartTotal">$0</span>
        <span class="bottom-cart-action">查看</span>
      </div>
    </button>

    <div id="cartDrawer" class="drawer hidden">
      <div class="drawer-mask" data-close="cart"></div>

      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>補貨車</h2>
          <button class="icon-btn" type="button" data-close="cart">✕</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-footer">
          <div class="total-row">
            <span>採購小計</span>
            <strong id="cartTotal">$0</strong>
          </div>

          <div id="cartRewardRow" class="total-row reward-row hidden">
            <span>本次預估回饋</span>
            <strong id="cartRewardTotal">$0</strong>
          </div>

          <button id="checkoutBtn" class="primary-btn" type="
